id: ddns-go
name: "DDNS-Go 动态域名"
version: "1.0"
description: "自动更新 DNS 解析记录，支持阿里云、Cloudflare 等服务商"
category: infra
author: community

depends_on: []
soft_depends_on: []

config:
  - key: DDNS_GO_CHECK_INTERVAL
    label: "IP 检测间隔（秒）"
    type: number
    default: 600
    required: true
    description: "多久检测一次 IP 变化"
  - key: DDNS_GO_CACHE_TIMES
    label: "缓存检测次数"
    type: number
    default: 12
    required: true
    description: "每 N 次检测才对比一次 DNS 记录，减少 API 调用"

access:
  subdomain: ""
  port: 9876
  protocol: http
  is_proxy: false

healthcheck:
  url: "http://127.0.0.1:9876"
  interval: 60s
  timeout: 10s
  retries: 3

resources:
  memory_limit: "64m"
  cpu_limit: "0.25"

docs:
  usage: |
    ## DDNS-Go 动态域名解析

    自动检测服务器 IP 变化并更新 DNS 解析记录，支持阿里云、Cloudflare 等多种 DNS 服务商。

    ### 功能说明
    - **自动检测 IP**：定期检测服务器公网 IP 变化
    - **自动更新 DNS**：IP 变化时自动更新 DNS 记录
    - **多服务商支持**：阿里云、Cloudflare、DNSPod 等
    - **IPv4/IPv6**：同时支持 IPv4 和 IPv6 地址

    ### 首次使用
    1. 安装模块后通过 `http://服务器IP:9876` 访问 DDNS-Go 配置页面
    2. 选择 DNS 服务商并填写 API 密钥
    3. 添加要解析的域名列表
    4. 保存配置即可自动运行

    ### 配置参数
    - **IP 检测间隔**：默认 600 秒，检测 IP 是否变化
    - **缓存检测次数**：默认 12 次，每 N 次才对比 DNS 记录

  faq:
    - q: "IP 变化了但 DNS 没有更新？"
      a: "检查 DNS 服务商 API 密钥是否正确，查看 DDNS-Go 日志"
    - q: "DDNS-Go 配置页面无法访问？"
      a: "确认 9876 端口未被占用，检查防火墙设置"

  links:
    - label: "DDNS-Go GitHub"
      url: "https://github.com/jeessy2/ddns-go"
