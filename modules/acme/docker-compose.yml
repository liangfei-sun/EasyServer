# EasyServer - ACME SSL 证书模块
# 支持多种 DNS 提供商（凭证统一由 data/acme/dns-credentials.env 注入）

services:
  acme.sh:
    image: neilpang/acme.sh
    container_name: easyserver-acme
    command: daemon
    volumes:
      - ${DATA_DIR}/acme/data:/acme.sh
      - ${PROJECT_ROOT:-/home/lf/easyserver}/modules/nginx/acme-challenge:/acme-challenge
      - ${PROJECT_ROOT:-/home/lf/easyserver}/modules/nginx/ssl:/etc/nginx/ssl
    network_mode: host
    # 各 DNS 提供商凭证由后端写入此文件（含自定义提供商变量）
    env_file:
      - ${PROJECT_ROOT:-/home/lf/easyserver}/modules/acme/dns-credentials.env
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
