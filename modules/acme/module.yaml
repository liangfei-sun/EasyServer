id: acme
name: "ACME SSL 证书"
version: "1.1"
description: "使用 acme.sh 自动申请和续签 SSL 证书，支持阿里云 / Cloudflare DNS 验证"
category: infra
author: community

depends_on: []
soft_depends_on:
  - nginx

# 配置项由 dns_provider 决定显示哪些字段，前端根据 provider 过滤
config:
  - key: ACME_DNS_PROVIDER
    label: "DNS 提供商"
    type: select
    options:
      - value: aliyun
        label: "阿里云"
      - value: cloudflare
        label: "Cloudflare"
    default: "aliyun"
    required: true
    description: "选择域名所在的 DNS 服务商"
  # --- 阿里云凭证 ---
  - key: ACME_ALI_KEY
    label: "阿里云 AccessKey ID"
    type: password
    default: ""
    required: false
    show_when: { field: "ACME_DNS_PROVIDER", value: "aliyun" }
    description: "RAM 子账号 AccessKey，需授予 AliyunDNSFullAccess 权限"
  - key: ACME_ALI_SECRET
    label: "阿里云 AccessKey Secret"
    type: password
    default: ""
    required: false
    show_when: { field: "ACME_DNS_PROVIDER", value: "aliyun" }
  # --- Cloudflare 凭证 ---
  - key: ACME_CF_TOKEN
    label: "Cloudflare API Token"
    type: password
    default: ""
    required: false
    show_when: { field: "ACME_DNS_PROVIDER", value: "cloudflare" }
    description: "需 Zone:DNS:Edit 权限，在 Cloudflare Dashboard > My Profile > API Tokens 创建"
  # --- 通用 ---
  - key: ACME_DOMAIN
    label: "主域名"
    type: string
    default: ""
    required: true
    description: "要申请证书的域名（如 example.com，非子域名）"

access:
  subdomain: ""
  port: 0
  protocol: ""
  is_proxy: false

healthcheck:
  url: ""
  interval: 0s

resources:
  memory_limit: "64m"
  cpu_limit: "0.25"

docs:
  usage: |
    ## ACME SSL 证书管理

    使用 acme.sh 自动申请和续签 Let's Encrypt SSL 证书，支持 DNS 验证方式。

    ### 功能说明
    - **自动申请证书**：支持泛域名证书 (*.你的域名)
    - **自动续签**：证书每 60 天自动续签，无需手动操作
    - **多 DNS 服务商**：支持阿里云、Cloudflare

    ### 阿里云配置步骤
    1. 登录 [RAM 控制台](https://ram.console.aliyun.com/users)，创建子用户
    2. 授权策略选择 `AliyunDNSFullAccess`
    3. 创建 AccessKey，复制 ID 和 Secret 填入配置

    ### Cloudflare 配置步骤
    1. 登录 [Cloudflare Dashboard](https://dash.cloudflare.com/profile/api-tokens)
    2. 点击 Create Token → Create Custom Token
    3. Token name 随意，Permissions 选择 Zone > DNS > Edit
    4. Zone Resources 选择你的域名
    5. 复制生成的 Token 填入配置

    ### 证书位置
    证书文件存储在 `data/acme/data/` 目录下，Nginx 模块会自动引用。

  faq:
    - q: "证书申请失败怎么办？"
      a: "检查 DNS 服务商 API 凭证是否正确，阿里云需确认有 DNS 管理权限，Cloudflare 需确认 Token 有 Zone DNS Edit 权限"
    - q: "证书到期后会自动续签吗？"
      a: "会，ACME 模块会自动续签，只需保持容器运行和凭证有效"
    - q: "支持切换 DNS 服务商吗？"
      a: "可以在全局设置中切换，切换后需要重新填写对应服务商的 API 凭证"

  links:
    - label: "acme.sh 官方文档"
      url: "https://github.com/acmesh-official/acme.sh/wiki"
    - label: "Let's Encrypt"
      url: "https://letsencrypt.org/"
    - label: "阿里云 RAM 控制台"
      url: "https://ram.console.aliyun.com/"
    - label: "Cloudflare API Tokens"
      url: "https://dash.cloudflare.com/profile/api-tokens"
