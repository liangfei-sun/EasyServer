id: notediscovery
name: "NoteDiscovery 笔记"
version: "1.0"
description: "基于 Markdown 的在线笔记管理工具，支持搜索和编辑"
category: notes
author: community

depends_on: []
soft_depends_on:
  - nginx
  - acme

config:
  - key: NOTEDISCOVERY_PORT
    label: "服务端口"
    type: number
    default: 8000
    required: true
  - key: NOTEDISCOVERY_AUTH_ENABLED
    label: "启用登录认证"
    type: boolean
    default: true
  - key: NOTEDISCOVERY_PASSWORD
    label: "登录密码"
    type: password
    default: ""
    required: false
    description: "启用认证时必须设置密码"
  - key: NOTEDISCOVERY_SECRET_KEY
    label: "会话密钥"
    type: password
    default: ""
    required: false
    description: "用于加密会话的随机字符串"

access:
  subdomain: notes
  port: 8000
  protocol: http

healthcheck:
  url: "http://127.0.0.1:{NOTEDISCOVERY_PORT}"
  interval: 30s
  timeout: 10s
  retries: 3

resources:
  memory_limit: "256m"
  cpu_limit: "1.0"

docs:
  usage: |
    ## NoteDiscovery 笔记管理

    基于 Markdown 的在线笔记管理工具，支持搜索、编辑和在线预览。

    ### 首次使用
    1. 通过 `https://notes.你的域名:8443` 访问
    2. 如果启用了认证，输入设置的密码登录
    3. 开始创建和管理 Markdown 笔记

    ### 主要功能
    - **Markdown 编辑**：支持实时预览的 Markdown 编辑器
    - **全文搜索**：快速搜索笔记内容
    - **文件管理**：支持上传和管理附件
    - **认证保护**：可启用密码认证保护笔记安全

    ### 配置说明
    - **登录认证**：建议启用，防止笔记被未授权访问
    - **会话密钥**：用于加密登录会话，建议使用随机字符串

    ### 数据存储
    笔记文件存储在 `data/notediscovery/data/` 目录下，为纯 Markdown 文件，可随时备份。

  faq:
    - q: "忘记密码怎么办？"
      a: "在模块配置中重新设置密码，重启服务即可生效"
    - q: "笔记数据如何备份？"
      a: "备份 `data/notediscovery/data/` 目录即可，均为 Markdown 文件"

  links:
    - label: "NoteDiscovery GitHub"
      url: "https://github.com/0x2E/NoteDiscovery"
