# EasyServer - FileBrowser 文件管理模块

services:
  filebrowser:
    # 修正镜像漂移：原钉 v2.31.2 但本地/实际运行一直是 latest(2.63.23)，
    # 且 Docker Hub 不可达无法拉取 v2.31.2，导致 recreate 必然卡在 pull。
    # 对齐为 latest 属零版本变更（与 recreate 前运行的是同一镜像 ID）。
    image: filebrowser/filebrowser:latest
    container_name: easyserver-filebrowser
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FILEBROWSER_PORT:-8081}:80"
    command: ["--database", "/db/filebrowser.db", "--address", "0.0.0.0"]
    volumes:
      - ${FILEBROWSER_DATA_PATH:-${DATA_DIR}/filebrowser/files}:/srv/data
      - ${DATA_DIR}/filebrowser-db:/db
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
