# EasyServer - Nextcloud 私有云盘模块
# 单容器部署：官方镜像 + SQLite（自用场景足够，无需独立数据库）

networks:
  nextcloud-internal:
    name: easyserver-nextcloud-internal
  easyserver-proxy:
    external: true

services:
  nextcloud:
    image: nextcloud:stable
    container_name: easyserver-nextcloud
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NEXTCLOUD_PORT:-8888}:80"
    networks:
      - nextcloud-internal
      - easyserver-proxy
    volumes:
      - ${DATA_DIR}/nextcloud/html:/var/www/html
      - ${DATA_DIR}/nextcloud/data:/var/www/html/data
    environment:
      - TZ=Asia/Shanghai
      # 以下环境变量仅首次初始化时生效（config.php 生成后不再读取）
      - SQLITE_DATABASE=true
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS:-cloud.lfblog.top}
      - TRUSTED_PROXIES=127.0.0.1
      - PHP_UPLOAD_LIMIT=10G
      - PHP_MEMORY_LIMIT=1G
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
