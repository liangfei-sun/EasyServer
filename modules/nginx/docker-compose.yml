# EasyServer - Nginx 反向代理模块
# 数据路径使用 ${DATA_DIR} 变量，由管理引擎注入

services:
  nginx:
    image: nginx:stable
    container_name: easyserver-nginx
    network_mode: ${NGINX_NETWORK_MODE:-host}
    volumes:
      - ${PROJECT_ROOT}/modules/nginx/conf.d:/etc/nginx/conf.d
      - ${PROJECT_ROOT}/modules/nginx/ssl:/etc/nginx/ssl
      - ${PROJECT_ROOT}/modules/nginx/log:/var/log/nginx
      - ${PROJECT_ROOT}/modules/nginx/acme-challenge:/acme-challenge
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
