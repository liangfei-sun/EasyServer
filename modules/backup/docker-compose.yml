# EasyServer - 数据备份模块

services:
  backup:
    build: .
    image: easyserver-backup:latest
    container_name: easyserver-backup
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - RESTIC_REPOSITORY=/backups/restic-repo
      - RESTIC_PASSWORD=${BACKUP_PASSWORD:?BACKUP_PASSWORD must be set}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - BACKUP_RETAIN_DAYS=${BACKUP_RETAIN_DAYS:-7}
      - BACKUP_CLOUD_PROVIDER=${BACKUP_CLOUD_PROVIDER:-none}
    volumes:
      - ${DATA_DIR}:/data:ro
      - ${DATA_DIR}/backups:/backups
      - ${PROJECT_ROOT:-/home/lf/easyserver}/.env:/config/.env:ro
      - ${PROJECT_ROOT:-/home/lf/easyserver}/modules/backup/scripts:/scripts:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - easyserver-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  easyserver-proxy:
    external: true
