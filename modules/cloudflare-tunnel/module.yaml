id: cloudflare-tunnel
name: "Cloudflare Tunnel"
version: "1.0"
description: "通过 Cloudflare 隧道将本地服务安全发布到公网，无需公网 IP"
category: network
author: community

depends_on: []
soft_depends_on: []

config:
  - key: CF_TUNNEL_TOKEN
    label: "Tunnel Token"
    type: password
    default: ""
    required: true
    description: "从 Cloudflare Dashboard 获取的隧道令牌"

access:
  subdomain: ""
  port: 0
  protocol: ""
  is_proxy: false

healthcheck:
  url: ""
  interval: 0s

resources:
  memory_limit: "128m"
  cpu_limit: "0.5"

docs:
  usage: |
    ## Cloudflare Tunnel 内网穿透

    通过 Cloudflare 隧道将本地服务安全发布到公网，无需公网 IP，自带 SSL 加密。

    ### 适用场景
    - 服务器没有公网 IP
    - 不想暴露服务器真实 IP
    - 需要免费的 SSL 证书和 DDoS 防护

    ### 配置步骤
    1. 登录 [Cloudflare Zero Trust](https://one.dash.cloudflare.com/)
    2. 进入 Networks → Tunnels，创建新隧道
    3. 复制生成的 Tunnel Token
    4. 在模块配置中粘贴 Token
    5. 安装模块后，在 Cloudflare Dashboard 中配置公网域名映射

    ### 域名映射示例
    | 公网域名 | 服务地址 |
    |---------|----------|
    | dashboard.example.com | http://localhost:9800 |
    | status.example.com | http://localhost:3001 |
    | media.example.com | http://localhost:8096 |

    ### 注意事项
    - Tunnel 自带 SSL 加密，无需额外配置 ACME 证书
    - 域名必须托管在 Cloudflare
    - 每次修改映射后无需重启隧道，自动生效

  faq:
    - q: "隧道连接失败？"
      a: "检查 Tunnel Token 是否正确，确认域名已托管在 Cloudflare"
    - q: "访问显示 502 错误？"
      a: "检查映射的服务地址和端口是否正确，确认后端服务已启动"
    - q: "可以同时使用域名反代和 Tunnel 吗？"
      a: "可以，但不建议同时使用，可能导致访问冲突"

  links:
    - label: "Cloudflare Tunnel 文档"
      url: "https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/"
    - label: "Cloudflare Zero Trust"
      url: "https://one.dash.cloudflare.com/"
